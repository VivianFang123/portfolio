<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章详情 · 方青青</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #002D62; --blue: #0057B8; --mid: #1A7FD4; --light: #68B3E8;
  --pale: #E8F3FB; --white: #fff; --off: #F7F9FC;
  --border: rgba(0,45,98,0.12); --text: #1a1a2e; --muted: #5a6a85;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--off); color: var(--text); font-size: 15px; line-height: 1.7; }

/* NAV */
nav { background: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 52px; position: sticky; top: 0; z-index: 100; }
.nav-back { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px; transition: color 0.2s; }
.nav-back:hover { color: white; }
.nav-brand { color: var(--white); font-family: 'DM Serif Display', serif; font-size: 15px; }
.nav-brand span { color: var(--light); }
.nav-right { display: flex; gap: 10px; align-items: center; }
.edit-btn { padding: 4px 13px; font-size: 11px; border-radius: 20px; border: 0.5px solid rgba(255,255,255,0.3); background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
.edit-btn:hover { background: rgba(255,255,255,0.15); color: white; }
.save-btn { padding: 4px 14px; background: #f0a500; color: var(--navy); border: none; border-radius: 20px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; display: none; }
body.editing .save-btn { display: inline-block; }
body.editing .edit-btn { display: none; }

/* EDIT HINT */
.edit-hint { display: none; text-align: center; padding: 6px 16px; background: #f0a500; color: var(--navy); font-size: 11px; font-weight: 500; }
body.editing .edit-hint { display: block; }

/* TOOLBAR */
.toolbar { display: none; position: sticky; top: 52px; z-index: 90; background: white; border-bottom: 1px solid var(--border); padding: 8px 40px; gap: 4px; flex-wrap: wrap; align-items: center; }
body.editing .toolbar { display: flex; }
.tb-btn { padding: 4px 9px; border: 0.5px solid var(--border); border-radius: 4px; background: white; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; color: var(--text); transition: background 0.15s; line-height: 1.4; }
.tb-btn:hover { background: var(--pale); }
.tb-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.tb-color { width: 22px; height: 22px; border-radius: 4px; border: 0.5px solid var(--border); cursor: pointer; overflow: hidden; }
.tb-color input { width: 30px; height: 30px; border: none; padding: 0; margin: -4px; cursor: pointer; }
.tb-img-btn { display: flex; align-items: center; gap: 4px; padding: 4px 9px; border: 0.5px solid var(--border); border-radius: 4px; background: var(--pale); font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; color: var(--navy); }
.tb-img-btn:hover { background: var(--light); color: white; }

/* HERO COVER */
.article-hero { position: relative; height: 260px; background: linear-gradient(135deg, var(--navy), var(--mid)); overflow: hidden; }
.article-hero img { width: 100%; height: 100%; object-fit: cover; display: none; }
.article-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,45,98,0.7) 0%, transparent 50%); }
.hero-change-btn { display: none; position: absolute; bottom: 14px; right: 14px; padding: 5px 12px; background: rgba(0,0,0,0.5); color: white; border: 0.5px solid rgba(255,255,255,0.3); border-radius: 20px; font-size: 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
body.editing .hero-change-btn { display: block; }
.hero-geo-art { position: absolute; right: 0; top: 0; opacity: 0.08; pointer-events: none; }

/* ARTICLE LAYOUT */
.article-wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
.article-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.article-tag { font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--blue); background: var(--pale); padding: 3px 10px; border-radius: 20px; }
.article-date { font-size: 11px; color: var(--muted); }

.article-title {
  font-family: 'DM Serif Display', serif;
  font-size: 34px;
  color: var(--navy);
  line-height: 1.25;
  margin-bottom: 10px;
  outline: none;
}
.article-subtitle {
  font-size: 16px;
  color: var(--muted);
  margin-bottom: 28px;
  outline: none;
  line-height: 1.6;
}
body.editing .article-title:empty:before { content: '点击输入标题...'; color: rgba(0,45,98,0.3); }
body.editing .article-subtitle:empty:before { content: '点击输入副标题或简介...'; color: rgba(0,45,98,0.25); }

.divider { height: 1px; background: var(--border); margin: 28px 0; }

/* EDITOR AREA */
#editor {
  min-height: 400px;
  outline: none;
  font-size: 15px;
  line-height: 1.8;
  color: var(--text);
}
#editor:empty:before { content: '开始写你的故事...点击此处输入内容。'; color: rgba(0,0,0,0.25); }
#editor p { margin-bottom: 14px; }
#editor h1 { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--navy); margin: 28px 0 12px; }
#editor h2 { font-family: 'DM Serif Display', serif; font-size: 21px; color: var(--navy); margin: 22px 0 10px; }
#editor h3 { font-size: 17px; font-weight: 500; color: var(--navy); margin: 18px 0 8px; }
#editor ul, #editor ol { padding-left: 24px; margin-bottom: 14px; }
#editor li { margin-bottom: 6px; }
#editor blockquote { border-left: 3px solid var(--light); padding: 10px 18px; margin: 20px 0; color: var(--muted); font-style: italic; background: var(--pale); border-radius: 0 6px 6px 0; }
#editor img { max-width: 100%; border-radius: 8px; margin: 16px 0; display: block; }
#editor a { color: var(--blue); }
#editor strong { font-weight: 500; }
#editor hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

body.editing #editor { border: 1.5px solid rgba(0,87,184,0.2); border-radius: 8px; padding: 16px; background: rgba(248,252,255,0.5); }
body.editing .article-title { outline: 1.5px solid rgba(0,87,184,0.2); border-radius: 6px; padding: 4px 8px; }
body.editing .article-subtitle { outline: 1.5px solid rgba(0,87,184,0.15); border-radius: 6px; padding: 4px 8px; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 500; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: white; border-radius: 12px; padding: 32px; width: 360px; max-width: 90vw; }
.modal h3 { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--navy); margin-bottom: 6px; }
.modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
.modal-input { width: 100%; padding: 9px 14px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 10px; }
.modal-input:focus { border-color: var(--blue); }
.modal-btns { display: flex; gap: 8px; }
.modal-confirm { flex: 1; padding: 9px; background: var(--navy); color: white; border: none; border-radius: 7px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.modal-confirm:hover { background: var(--blue); }
.modal-cancel { padding: 9px 16px; background: var(--off); color: var(--muted); border: 0.5px solid var(--border); border-radius: 7px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.modal-err { font-size: 12px; color: #c0392b; display: none; margin-bottom: 8px; }
.modal-err.show { display: block; }

footer { background: var(--navy); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
.footer-left { color: rgba(255,255,255,0.4); font-size: 11px; }
.footer-right a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 11px; margin-left: 16px; transition: color 0.2s; }
.footer-right a:hover { color: var(--light); }

@media (max-width: 700px) {
  nav { padding: 0 16px; }
  .toolbar { padding: 8px 16px; top: 52px; }
  .article-wrap { padding: 28px 16px 60px; }
  .article-title { font-size: 26px; }
  .article-hero { height: 200px; }
  footer { padding: 14px 16px; }
}
</style>
</head>
<body>

<!-- EDIT HINT -->
<div class="edit-hint">✏️ 编辑模式 — 点击标题/正文即可修改，工具栏可设置格式和插入图片</div>

<!-- NAV -->
<nav>
  <a class="nav-back" href="index.html">← <span class="nav-brand">方青青 <span>·</span> Vivian Fang</span></a>
  <div class="nav-right">
    <button class="edit-btn" onclick="showEditModal()">✏️ 编辑</button>
    <button class="save-btn" onclick="saveArticle()">✓ 保存文章</button>
  </div>
</nav>

<!-- EDIT PASSWORD MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>编辑验证</h3>
    <p>请输入编辑密码以修改文章内容</p>
    <input class="modal-input" type="password" id="editPwInput" placeholder="请输入编辑密码" onkeydown="if(event.key==='Enter')confirmEdit()">
    <div class="modal-err" id="editPwErr">密码错误，请重试</div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeEditModal()">取消</button>
      <button class="modal-confirm" onclick="confirmEdit()">确认进入编辑</button>
    </div>
  </div>
</div>

<!-- RICH TEXT TOOLBAR -->
<div class="toolbar">
  <button class="tb-btn" onclick="fmt('bold')" title="加粗"><b>B</b></button>
  <button class="tb-btn" onclick="fmt('italic')" title="斜体"><i>I</i></button>
  <button class="tb-btn" onclick="fmt('underline')" title="下划线"><u>U</u></button>
  <button class="tb-btn" onclick="fmt('strikeThrough')" title="删除线"><s>S</s></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="fmtBlock('h1')" title="大标题">H1</button>
  <button class="tb-btn" onclick="fmtBlock('h2')" title="中标题">H2</button>
  <button class="tb-btn" onclick="fmtBlock('h3')" title="小标题">H3</button>
  <button class="tb-btn" onclick="fmtBlock('p')" title="正文">¶</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="fmt('insertUnorderedList')" title="无序列表">• 列表</button>
  <button class="tb-btn" onclick="fmt('insertOrderedList')" title="有序列表">1. 列表</button>
  <button class="tb-btn" onclick="fmtBlock('blockquote')" title="引用">❝</button>
  <button class="tb-btn" onclick="fmt('insertHorizontalRule')" title="分割线">—</button>
  <div class="tb-sep"></div>
  <div class="tb-color" title="文字颜色"><input type="color" value="#1a1a2e" oninput="fmt('foreColor', this.value)"></div>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="fmt('justifyLeft')" title="左对齐">⬅</button>
  <button class="tb-btn" onclick="fmt('justifyCenter')" title="居中">☰</button>
  <button class="tb-btn" onclick="fmt('justifyRight')" title="右对齐">➡</button>
  <div class="tb-sep"></div>
  <label class="tb-img-btn" title="插入图片">
    🖼 插入图片
    <input type="file" accept="image/*" style="display:none" onchange="insertImage(event)">
  </label>
  <button class="tb-btn" onclick="insertLink()" title="插入链接">🔗 链接</button>
</div>

<!-- ARTICLE HERO -->
<div class="article-hero" id="articleHero">
  <img id="heroImg" src="" alt="">
  <div class="article-hero-overlay"></div>
  <svg class="hero-geo-art" width="300" height="300" viewBox="0 0 520 520" fill="none">
    <polygon points="260,20 500,160 500,360 260,500 20,360 20,160" stroke="white" stroke-width="1.5"/>
    <circle cx="260" cy="260" r="140" stroke="white" stroke-width="0.8"/>
    <line x1="260" y1="20" x2="260" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="20" y1="260" x2="500" y2="260" stroke="white" stroke-width="0.5"/>
  </svg>
  <button class="hero-change-btn" onclick="document.getElementById('heroCoverInput').click()">🖼 更换封面图</button>
  <input type="file" id="heroCoverInput" accept="image/*" style="display:none" onchange="changeHeroCover(event)">
</div>

<!-- ARTICLE CONTENT -->
<div class="article-wrap">
  <div class="article-meta">
    <span class="article-tag" id="articleTag">实习</span>
    <span class="article-date" id="articleDate">2024</span>
  </div>
  <h1 class="article-title" id="articleTitle" contenteditable="false">联合利华 · 市场部新品孵化项目</h1>
  <p class="article-subtitle" id="articleSubtitle" contenteditable="false">空气净化器新品孵化 · 上海 · 市场营销</p>
  <div class="divider"></div>
  <div id="editor" contenteditable="false">
    <p>在这里写下你的项目介绍、工作内容、收获和亮点。可以插入图片，设置标题层级，添加引用块。</p>
    <p>点击右上角 <strong>✏️ 编辑</strong> 按钮（需输入密码）即可开始编辑这篇文章。</p>
  </div>
</div>

<footer>
  <span class="footer-left">© 2026 方青青 · Vivian Fang · Johns Hopkins University</span>
  <div class="footer-right">
    <a href="index.html">← 返回主页</a>
    <a href="mailto:vivifong2022@163.com">邮箱</a>
  </div>
</footer>

<script>
const EDIT_PASS = '20030108';
let isEditing = false;

/* ARTICLE DATA per card id */
const articleData = {
  exp1: { tag: '实习', date: '上海 · 市场营销', title: '联合利华 · 市场部新品孵化项目', subtitle: '空气净化器新品孵化 · 上海 · 2023', content: '<p>在这里写下你的项目介绍、工作内容、收获和亮点。可以插入图片，设置标题层级，添加引用块。</p><p>点击右上角 <strong>✏️ 编辑</strong> 按钮（需输入密码）即可开始编辑这篇文章。</p>' },
  exp2: { tag: '实习', date: '北京 · 数字广告', title: '北京乐思创信科技 · 信息流广告优化师', subtitle: '信息流广告投放与优化 · 北京', content: '<p>在这里写下你的项目介绍。</p>' },
  exp3: { tag: '实习', date: '西安 · 新闻媒体', title: '西安华商报社 · 实习记者', subtitle: '新闻采编与报道 · 西安', content: '<p>在这里写下你的项目介绍。</p>' },
  proj1: { tag: '创业竞赛', date: 'Johns Hopkins · 2024', title: 'JHU Spark 创业比赛 · 二手交易平台孵化', subtitle: '约翰霍普金斯大学孵化器项目', content: '<p>在这里写下你的项目介绍。</p>' },
  proj2: { tag: '独立调研', date: '独立研究', title: '中老年微短剧社交媒体传播策略研究', subtitle: '社交媒体传播策略 · 独立调研', content: '<p>在这里写下你的项目介绍。</p>' },
  proj3: { tag: '活动策划', date: '北京语言大学 · 文化', title: '北京语言大学世界文化节活动组织', subtitle: '跨国文化活动策划与执行', content: '<p>在这里写下你的项目介绍。</p>' },
};

/* LOAD ARTICLE */
const params = new URLSearchParams(location.search);
const articleId = params.get('id') || localStorage.getItem('articleId') || 'exp1';
const saved = localStorage.getItem('article_' + articleId);
const data = saved ? JSON.parse(saved) : (articleData[articleId] || articleData.exp1);

document.getElementById('articleTag').textContent = data.tag || '经历';
document.getElementById('articleDate').textContent = data.date || '';
document.getElementById('articleTitle').textContent = data.title || '';
document.getElementById('articleSubtitle').textContent = data.subtitle || '';
document.getElementById('editor').innerHTML = data.content || '';
if (data.heroImg) {
  const img = document.getElementById('heroImg');
  img.src = data.heroImg; img.style.display = 'block';
}
document.title = (data.title || '文章') + ' · 方青青';

/* EDIT MODAL */
function showEditModal() {
  document.getElementById('editModal').classList.add('show');
  setTimeout(() => document.getElementById('editPwInput').focus(), 100);
}
function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  document.getElementById('editPwInput').value = '';
  document.getElementById('editPwErr').classList.remove('show');
}
function confirmEdit() {
  if (document.getElementById('editPwInput').value === EDIT_PASS) {
    closeEditModal(); enterEditMode();
  } else {
    document.getElementById('editPwErr').classList.add('show');
    document.getElementById('editPwInput').value = '';
    document.getElementById('editPwInput').focus();
  }
}
document.getElementById('editModal').addEventListener('click', e => { if (e.target === document.getElementById('editModal')) closeEditModal(); });

/* EDIT MODE */
function enterEditMode() {
  isEditing = true;
  document.body.classList.add('editing');
  document.getElementById('editor').contentEditable = 'true';
  document.getElementById('articleTitle').contentEditable = 'true';
  document.getElementById('articleSubtitle').contentEditable = 'true';
  document.getElementById('editor').focus();
}
function saveArticle() {
  isEditing = false;
  document.body.classList.remove('editing');
  document.getElementById('editor').contentEditable = 'false';
  document.getElementById('articleTitle').contentEditable = 'false';
  document.getElementById('articleSubtitle').contentEditable = 'false';
  const toSave = {
    tag: document.getElementById('articleTag').textContent,
    date: document.getElementById('articleDate').textContent,
    title: document.getElementById('articleTitle').textContent,
    subtitle: document.getElementById('articleSubtitle').textContent,
    content: document.getElementById('editor').innerHTML,
    heroImg: document.getElementById('heroImg').src || ''
  };
  localStorage.setItem('article_' + articleId, JSON.stringify(toSave));
  const notice = document.createElement('div');
  notice.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#002D62;color:white;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;';
  notice.textContent = '✓ 文章已保存';
  document.body.appendChild(notice);
  setTimeout(() => notice.remove(), 2500);
}

/* TOOLBAR FUNCTIONS */
function fmt(cmd, val) { document.execCommand(cmd, false, val || null); document.getElementById('editor').focus(); }
function fmtBlock(tag) { document.execCommand('formatBlock', false, tag); document.getElementById('editor').focus(); }
function insertImage(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('editor').focus();
    document.execCommand('insertHTML', false, `<img src="${ev.target.result}" style="max-width:100%;border-radius:8px;margin:16px 0;">`);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
function insertLink() {
  const url = prompt('请输入链接地址：', 'https://');
  if (url) { document.execCommand('createLink', false, url); }
}

/* HERO COVER */
function changeHeroCover(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('heroImg');
    img.src = ev.target.result; img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
